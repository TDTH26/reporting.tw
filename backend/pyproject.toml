[project]
name = "uavr"
version = "0.1.0"
description = "UAV Sighting Reporting System backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncmy>=0.2.10",
  "alembic>=1.14",
  "numpy>=2.1",
  "shapely>=2.0",
  "jsonschema>=4.23",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "cryptography>=43",
  "python-multipart>=0.0.17",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uavr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "B017", "E501"]
"uavr/seed_data.py" = ["E501"]
"uavr/interview.py" = ["E501"]
