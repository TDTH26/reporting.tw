name: uavr_native
description: Android native capabilities - OpenDroneID / Remote ID receiver, rotation-vector compass, Play Integrity. Web fallbacks for orientation.
publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: tw.reporting.uavr_native
        pluginClass: UavrNativePlugin
