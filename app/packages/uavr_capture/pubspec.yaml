publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  uavr_api:
  uavr_ui:
  camera: ^0.11.0
  record: ^6.0.0
  image_picker: ^1.0.0
  crypto: ^3.0.0
  http: ^1.0.0
  path_provider: ^2.0.0
  shared_preferences: ^2.0.0
  workmanager: ^0.9.0
  cross_file: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

