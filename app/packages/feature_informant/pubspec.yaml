name: feature_informant
description: Informant reporting app screens (Android + web).
publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  uavr_api:
  uavr_core:
  uavr_ui:
  uavr_maps:
  uavr_capture:
  uavr_native:
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  geolocator: ^14.0.0
  permission_handler: ^13.0.0
  firebase_core: any
  firebase_messaging: ^16.0.0
  uuid: ^4.0.0
  latlong2: ^0.9.1
  flutter_map: ^8.0.0
  intl: any
  shared_preferences: ^2.0.0
  flutter_secure_storage: any
  camera: ^0.11.0
  crypto: ^3.0.0
  cross_file: any
  url_launcher: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.0.0

flutter:
  generate: true
  uses-material-design: true
