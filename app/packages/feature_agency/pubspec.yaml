name: feature_agency
description: Agency console screens (web, government network only).
publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  uavr_api:
  uavr_core:
  uavr_ui:
  uavr_maps:
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  fl_chart: ^1.0.0
  latlong2: ^0.9.1
  flutter_map: ^8.0.0
  url_launcher: any
  intl: any
  shared_preferences: ^2.0.0
  web: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/atreides_logo_light.png
    - assets/app_icon.png
