# Dev reverse proxy. Production splits these across hosts:
#   reporting.tw          landing site + informant web app (/app/)
#   api.reporting.tw      API + tus uploads (public)
#   console.<gov network>  agency console (never exposed publicly)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    client_max_body_size 0;

    # tusd hooks are internal only.
    location /api/v1/uploads/hooks { return 403; }

    # The live channel authenticates with ?token=..., which must not end up in access logs.
    location /api/v1/ws {
        access_log off;
        proxy_pass http://api:8000/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /files/ {
        proxy_pass http://tusd:8080/files/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /app/ {
        alias /srv/builds/informant-web/;
        try_files $uri $uri/ /app/index.html;
    }

    location /console/ {
        alias /srv/builds/agency-web/;
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        root /srv/site;
        try_files $uri $uri/ $uri.html =404;
    }
}
