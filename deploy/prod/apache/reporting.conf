# reporting.tw - all Apache virtual hosts for the project (Cloudflare in front, SSL mode "Full", self-signed origin certificate).
# Modules: ssl proxy proxy_http headers remoteip. HTTP->HTTPS and www redirects are done by Cloudflare.
# API (127.0.0.1:8100) and tusd (127.0.0.1:8180) are systemd services (deploy/prod/systemd), running as reportingtw.
# Cloudflare Access protects console.reporting.tw. Evidence downloads go through signed API URLs (/v1/media).

# reporting.tw: landing page and informant web app (/app/)
<VirtualHost *:443>
ServerName reporting.tw
ServerAlias www.reporting.tw
RemoteIPHeader CF-Connecting-IP
DocumentRoot /sites/reporting.tw/site
ErrorLog /var/log/apache2/reporting.tw-error.log
CustomLog /var/log/apache2/reporting.tw-access.log combined
Options -Indexes
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/ssl/certs/static.crt
SSLCertificateKeyFile /etc/ssl/private/static.key

    # File names are not content-hashed (Flutter web, site.css): browsers and Cloudflare must revalidate on every
    # load (cheap 304 via ETag), so a deploy is visible at once. Needs Cloudflare Browser Cache TTL = "Respect
    # Existing Headers", otherwise Cloudflare replaces this with its own max-age.
    <Directory /sites/reporting.tw/site>
        Header set Cache-Control "no-cache"
        Require all granted
    </Directory>

    Alias /app/ /sites/reporting.tw/app/
    <Directory /sites/reporting.tw/app>
        # Single-page app: deep links fall back to the Flutter index.
        FallbackResource /app/index.html
        Header set Cache-Control "no-cache"
        Require all granted
    </Directory>
</VirtualHost>

# api.reporting.tw: backend API (127.0.0.1:8100) and resumable uploads (tusd, 127.0.0.1:8180)
<VirtualHost *:443>
ServerName api.reporting.tw
RemoteIPHeader CF-Connecting-IP
ErrorLog /var/log/apache2/api.reporting.tw-error.log
# The live channel authenticates with ?token=..., so log the path without the query string.
CustomLog /var/log/apache2/api.reporting.tw-access.log "%a %l %u %t \"%m %U %H\" %>s %b %D"
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/ssl/certs/static.crt
SSLCertificateKeyFile /etc/ssl/private/static.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Real client IP for the API's rate limits and spam scoring: the address mod_remoteip took from
    # CF-Connecting-IP. Always overwritten here, so clients cannot inject it.
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    # Evidence uploads arrive in 1 MB chunks; tusd enforces its own 200 MB per-file limit.
    LimitRequestBody 0

    # Only tusd (on 127.0.0.1, not through Apache) may call the upload hooks.
    <Location /v1/uploads/hooks>
        Require all denied
    </Location>

    ProxyPass        /v1/ws http://127.0.0.1:8100/v1/ws upgrade=websocket timeout=3600
    ProxyPass        /files/ http://127.0.0.1:8180/files/ timeout=600
    ProxyPassReverse /files/ http://127.0.0.1:8180/files/
    ProxyPass        / http://127.0.0.1:8100/ timeout=120
    ProxyPassReverse / http://127.0.0.1:8100/
</VirtualHost>

# console.reporting.tw: agency console (static Flutter build)
<VirtualHost *:443>
ServerName console.reporting.tw
RemoteIPHeader CF-Connecting-IP
DocumentRoot /sites/reporting.tw/console
ErrorLog /var/log/apache2/console.reporting.tw-error.log
CustomLog /var/log/apache2/console.reporting.tw-access.log combined
Options -Indexes
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/ssl/certs/static.crt
SSLCertificateKeyFile /etc/ssl/private/static.key

    <Directory /sites/reporting.tw/console>
        FallbackResource /index.html
        # Revalidate every file on load (see the reporting.tw vhost).
        Header set Cache-Control "no-cache"
        Require all granted
    </Directory>
</VirtualHost>
