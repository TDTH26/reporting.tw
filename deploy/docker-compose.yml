# Local development stack (production runs without Docker, see deploy/prod/README.md).
#   make up      -> http://localhost:8480 (landing), /app/ (informant web), /console/, /api/
name: uavr

x-backend-env: &backend-env
  UAVR_DATABASE_URL: mysql+asyncmy://uavr:uavr@db:3306/uavr
  UAVR_DATA_DIR: /data
  UAVR_PUBLIC_API_URL: http://localhost:8480/api
  UAVR_TUS_PUBLIC_URL: http://localhost:8480/files/
  UAVR_ENV: dev
  # export FEATHERLESS_API_KEY before `make up` to enable AI triage (empty = disabled)
  UAVR_FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:-}

services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uavr
      MYSQL_USER: uavr
      MYSQL_PASSWORD: uavr
    ports: ["33306:3306"]
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      retries: 30

  # The test suite creates its own database (uavr_test) and needs CREATE/DROP rights.
  db-grants:
    image: mysql:8.0
    depends_on: {db: {condition: service_healthy}}
    entrypoint: ["mysql", "-hdb", "-uroot", "-proot", "-e",
                 "GRANT ALL ON *.* TO 'uavr'@'%'; SET GLOBAL log_bin_trust_function_creators = 1; FLUSH PRIVILEGES;"]

  tusd:
    image: tusproject/tusd:v2
    depends_on: [api]
    user: "0"
    command:
      - -upload-dir=/data/uploads
      - -base-path=/files/
      - -behind-proxy
      - -hooks-http=http://api:8000/v1/uploads/hooks
      - -hooks-http-forward-headers=Upload-Token
      - -hooks-enabled-events=pre-create,post-finish
      - -max-size=209715200
      - -cors-allow-headers=Upload-Token
    volumes: [../data:/data]
    ports: ["8180:8080"]

  api:
    build: &backend-build
      context: ../backend
      additional_contexts: {schemas: ../schemas}
    user: "0"
    command: ["sh", "-c", "alembic upgrade head && uvicorn uavr.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    environment: *backend-env
    volumes: [../data:/data]
    depends_on:
      db: {condition: service_healthy}
    ports: ["8100:8000"]

  worker:
    build: *backend-build
    user: "0"
    command: ["python", "-m", "uavr.worker"]
    environment: *backend-env
    volumes: [../data:/data]
    depends_on: [api]

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/site:/srv/site:ro
      # Parent dir: `flutter build web` recreates its output folder, which would orphan a direct mount.
      - ../app/apps/uavr/build:/srv/builds:ro
    depends_on: [api, tusd]
    ports: ["8480:80"]

volumes:
  mysqldata:
